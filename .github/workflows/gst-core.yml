name: GST Core web
on:
  push:
    branches: [codex/gst-production-readiness-20261013]
  pull_request:
permissions:
  contents: read
concurrency:
  group: gst-web-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  gst-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS50ZXN0JA
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3101
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: GST contracts, regressions, translations and fixture production build
        run: npm run build:verified
